name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: Tag matches the version of package.json
        run: node scripts/check-tag-cli.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-15-intel
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run dist
      - name: E2E (Linux needs a display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      - name: E2E
        if: runner.os != 'Linux'
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Upload to releases of coderaiser/cloudcmd
        env:
          GH_TOKEN: ${{ secrets.CLOUDCMD_RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo coderaiser/cloudcmd --clobber
